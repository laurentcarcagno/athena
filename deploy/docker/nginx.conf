# Application web : fichiers statiques + même origine pour l'API (le cookie de session reste de même origine).
# La CSP est posée ici (plan § 13.3) : aucun script ni style en ligne, aucune ressource externe.
# nginx n'hérite pas des en-têtes d'un bloc parent dès qu'un bloc enfant en déclare un : on les inclut partout.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  include /etc/nginx/headers.inc;

  location /assets/ {
    include /etc/nginx/headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # API et authentification : relayées vers le service api (nom DNS fourni par Kubernetes).
  # Résolution différée (variable + resolver) : nginx démarre même si le service api n'existe pas encore.
  location ~ ^/(v1|auth|healthz)(/|$) {
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
    set $athena_api "${ATHENA_API_UPSTREAM}";
    proxy_pass $athena_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 1m;
  }

  location / {
    include /etc/nginx/headers.inc;
    add_header Cache-Control "no-store" always;
    try_files $uri /index.html;
  }
}
